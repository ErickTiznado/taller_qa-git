<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tareas del taller</title>
  <meta name="description" content="App de tareas mínima usada como campo de práctica para aprender Git, issues y tableros." />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
  <svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-check" viewBox="0 0 24 24">
      <path d="M3.5 12.8 9 18.2 20.5 5.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-trash" viewBox="0 0 24 24">
      <path d="M4.5 7h15M10 7V4.5h4V7M6.8 7l.9 12.5h8.6L17.2 7M10.2 10.8v5.4M13.8 10.8v5.4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5.5v13M5.5 12h13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
    </symbol>
    <symbol id="i-nib" viewBox="0 0 24 24">
      <path d="M12 2.8 17.6 9.4 12 21.2 6.4 9.4 12 2.8ZM6.4 9.4h11.2M12 9.4v11.8" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
    <symbol id="i-libro" viewBox="0 0 24 24">
      <path d="M3.5 4.5h6.2c1.3 0 2.3 1 2.3 2.3v12.7c0-1-.9-1.8-2-1.8H3.5V4.5ZM20.5 4.5h-6.2c-1.3 0-2.3 1-2.3 2.3v12.7c0-1 .9-1.8 2-1.8h6.5V4.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
    </symbol>
  </svg>

  <div class="marco-app">

    <!-- ============================ margen izquierdo ============================ -->
    <aside class="marginal">
      <div class="marca">
        <span class="marca-nombre">Tareas</span>
        <span class="marca-filete" aria-hidden="true"></span>
        <span class="marca-pie">Taller de Git</span>
      </div>

      <nav class="nav-vistas" aria-label="Vistas">
        <p class="rotulo">Vista</p>
        <ul>
          <li>
            <button type="button" class="nav-item activo" data-filtro="todas" aria-current="page">
              <span class="nav-texto">Todas</span>
              <span class="nav-cifra" data-cuenta="todas">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" data-filtro="pendientes">
              <span class="nav-texto">Pendientes</span>
              <span class="nav-cifra" data-cuenta="pendientes">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item" data-filtro="completadas">
              <span class="nav-texto">Completadas</span>
              <span class="nav-cifra" data-cuenta="completadas">0</span>
            </button>
          </li>
        </ul>
      </nav>

      <nav class="nav-prioridades" aria-label="Filtrar por prioridad">
        <p class="rotulo">Prioridad</p>
        <ul>
          <li>
            <button type="button" class="nav-item marcada cualquiera activo" data-prioridad="todas" aria-pressed="true">
              <span class="nav-texto">Cualquiera</span>
              <span class="nav-cifra" data-cuenta="p-todas">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item marcada alta" data-prioridad="alta" aria-pressed="false">
              <span class="nav-texto">Alta</span>
              <span class="nav-cifra" data-cuenta="p-alta">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item marcada media" data-prioridad="media" aria-pressed="false">
              <span class="nav-texto">Media</span>
              <span class="nav-cifra" data-cuenta="p-media">0</span>
            </button>
          </li>
          <li>
            <button type="button" class="nav-item marcada baja" data-prioridad="baja" aria-pressed="false">
              <span class="nav-texto">Baja</span>
              <span class="nav-cifra" data-cuenta="p-baja">0</span>
            </button>
          </li>
        </ul>
      </nav>

      <div class="avance">
        <p class="rotulo">Avance</p>
        <p class="avance-texto" id="avance-texto"></p>
        <div class="avance-regla" role="presentation">
          <span class="avance-lleno" id="avance-lleno"></span>
        </div>
      </div>

      <div class="marginal-pie">
        <span class="filete-corto" aria-hidden="true"></span>
        <ul class="enlaces">
          <li>
            <a href="docs/TALLER.md">
              <svg aria-hidden="true"><use href="#i-libro" /></svg>
              <span>Guía del taller</span>
            </a>
          </li>
          <li>
            <a href="docs/CHULETA.md">
              <svg aria-hidden="true"><use href="#i-libro" /></svg>
              <span>Chuleta de Git</span>
            </a>
          </li>
        </ul>
      </div>
    </aside>

    <!-- ============================ cuerpo ============================ -->
    <main class="principal">
      <div class="columna">

        <header class="encabezado">
          <div class="encabezado-texto">
            <h1 class="titulo-vista" id="titulo-vista">Todas las tareas</h1>
            <p class="fecha" id="fecha"></p>
          </div>
          <button id="limpiar" class="btn-limpiar" type="button">
            <svg aria-hidden="true"><use href="#i-trash" /></svg>
            <span>Borrar completadas</span>
          </button>
        </header>

        <form id="form-tarea" class="compositor" novalidate>
          <div class="campo campo-texto">
            <svg class="marca-prompt" aria-hidden="true"><use href="#i-nib" /></svg>
            <label class="oculto" for="input-titulo">Título de la tarea</label>
            <input
              id="input-titulo"
              name="titulo"
              type="text"
              placeholder="Escribí una tarea nueva"
              autocomplete="off"
              maxlength="120"
            />
          </div>

          <div class="campo campo-prioridad">
            <label class="oculto" for="input-prioridad">Prioridad</label>
            <select id="input-prioridad" name="prioridad">
              <option value="baja">Baja</option>
              <option value="media" selected>Media</option>
              <option value="alta">Alta</option>
            </select>
          </div>

          <button id="btn-agregar" class="btn-agregar" type="submit" disabled>
            <svg aria-hidden="true"><use href="#i-plus" /></svg>
            <span>Agregar</span>
          </button>
        </form>

        <div id="grupos" class="grupos"></div>

        <p id="vacio" class="vacio" hidden></p>

        <footer class="pie">
          <span id="contador" class="contador" aria-live="polite"></span>
        </footer>

      </div>
    </main>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
